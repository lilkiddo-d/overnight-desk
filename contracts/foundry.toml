[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../app/public/deployments" },
  { access = "read", path = "./config" },
  { access = "read", path = "./out" },
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 120
